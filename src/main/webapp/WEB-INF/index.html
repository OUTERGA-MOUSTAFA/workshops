<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gestion École</title>
</head>

<body>

    <h1>Liste des Apprenants (Consommation de l'API REST)</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th>Filière</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Les données injectées par JS s'afficheront ici -->
        </tbody>
    </table>

    <!-- Formulaire HTML -->
<form id="apprenantForm">
    <input type="text" id="nom" placeholder="Nom" required>
    <input type="text" id="prenom" placeholder="Prénom" required>
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="filiere" placeholder="Filière">
    <button type="submit">Ajouter l'apprenant</button>
</form>

<script>
    document.getElementById('apprenantForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const nouvelApprenant = {
            nom: document.getElementById('nom').value,
            prenom: document.getElementById('prenom').value,
            email: document.getElementById('email').value,
            filiere: document.getElementById('filiere').value
        };

        // Envoi de la requête POST vers l'API Jersey
        fetch('http://localhost:8080/workshop-connection-db/api/apprenants', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(nouvelApprenant)
        })
        .then(response => {
            if (response.ok) {
                alert('Apprenant ajouté avec succès !');
                // Recharger ou rafraîchir la liste ici si besoin
            } else {
                alert('Erreur lors de l\'ajout.');
            }
        })
        .catch(error => console.error('Erreur:', error));
    });
        // Connexion du Frontend au Backend via l'API REST
        fetch('http://localhost:8080/workshop-connection-db/api/apprenants')
            .then(response => response.json()) // Récupération du JSON renvoyé par Jersey
            .then(data => {
                const liste = document.getElementById('liste');
                data.forEach(apprenant => {
                    let li = document.createElement('li');
                    li.textContent = `${apprenant.prenom} ${apprenant.nom} - ${apprenant.filiere}`;
                    liste.appendChild(li);
                });
            })
            .catch(error => console.error('Erreur de connexion à l’API:', error));
    </script>
</body>

</html>
