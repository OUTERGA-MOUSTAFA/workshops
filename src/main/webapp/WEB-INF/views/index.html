<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gestion École</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <form
      method="post"
      action="..."
      class="px-4 mt-6"
    >
      <div class="space-y-6 max-w-md mx-auto">
        <h1 class="text-lg font-semibold text-slate-900">
          Ajouter un apprenant
        </h1>

        <div class="flex items-center gap-2">
          <label
            for="nom"
            class="w-32 text-slate-900 font-medium text-sm inline-block"
            >Nom</label
          >
          <input
            type="text"
            id="nom"
            name="nom"
            placeholder="Alaoui"
            required
            class="px-1 py-2.5 text-sm text-slate-900 bg-white w-full border-b-2 border-slate-300 focus:border-blue-600 outline-none"
          />
        </div>
        <div class="flex items-center gap-2">
          <label
            for="prenom"
            class="w-32 text-slate-900 font-medium text-sm inline-block"
            >Prénom</label
          >
          <input
            type="text"
            id="prenom"
            name="prenom"
            placeholder="Sara"
            required
            class="px-1 py-2.5 text-sm text-slate-900 bg-white w-full border-b-2 border-slate-300 focus:border-blue-600 outline-none"
          />
        </div>
        <div class="flex items-center gap-2">
          <label
            for="email"
            class="w-32 text-slate-900 font-medium text-sm inline-block"
            >Email</label
          >
          <input
            type="email"
            id="email"
            name="email"
            placeholder="sara@ecole.ma"
            required
            class="px-1 py-2.5 text-sm text-slate-900 bg-white w-full border-b-2 border-slate-300 focus:border-blue-600 outline-none"
          />
        </div>
        <div class="flex items-center gap-2">
          <label
            for="filiere"
            class="w-32 text-slate-900 font-medium text-sm inline-block"
            >Filière</label
          >
          <input
            type="text"
            id="filiere"
            name="filiere"
            placeholder="Informatique"
            required
            class="px-1 py-2.5 text-sm text-slate-900 bg-white w-full border-b-2 border-slate-300 focus:border-blue-600 outline-none"
          />
        </div>

        <div class="flex items-center gap-3">
          <button
            type="submit"
            class="py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
          >
            Ajouter
          </button>
          <a
            href="http://localhost:8080/workshop-connection-db/apprenants"
            class="text-sm font-medium text-blue-700 hover:underline"
            >Retour à la liste</a
          >
        </div>
      </div>
    </form>
  </body>
</html>
